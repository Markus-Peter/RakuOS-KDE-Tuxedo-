name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Create output directory
        run: mkdir -p output config

      - name: Create minimal repo config
        run: |
          echo "[fedora]
          name=Fedora \$releasever - \$basearch
          metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-\$releasever&arch=\$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=0
          type=rpm
          " > config/fedora.repo

      - name: Pull custom container image
        run: sudo podman pull ghcr.io/markus-peter/rakuos-kde-tuxedo:latest

      - name: Run bootc-image-builder directly
        run: |
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            --volume ./output:/output \
            --volume ./config:/config:ro \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build \
            --type iso \
            --rootfs btrfs \
            ghcr.io/markus-peter/rakuos-kde-tuxedo:latest

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rakuos-tuxedo-iso
          path: output/
