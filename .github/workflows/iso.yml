name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Build Bootc ISO
        uses: osbuild/image-builder-action@main
        with:
          image: ghcr.io/markus-peter/rakuos-kde-tuxedo:latest
          type: iso
          distro: fedora
          release: "45"
